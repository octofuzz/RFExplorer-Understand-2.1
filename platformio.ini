[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:scripts/shared_bus_build.py, post:scripts/package_firmware.py
build_flags =
    -std=gnu++14
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    jgromes/RadioLib@7.7.1
    m5stack/M5UnitUnified@0.5.5
    m5stack/M5Utility@0.2.0
    m5stack/M5HAL@0.1.2
    z3t0/IRremote@4.7.1
    https://github.com/m5stack/M5Unit-NFC.git#93745b547364f310cd64b5155a870103a7800a5d
    Wire
    SPI
    FS
    SD
